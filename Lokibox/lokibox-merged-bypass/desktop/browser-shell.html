<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LokiBox Browser</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, "Microsoft YaHei", sans-serif; background: #111827; color: #e5e7eb; }
      body { margin: 0; overflow: hidden; }
      #toolbar { align-items: center; box-sizing: border-box; display: flex; gap: 8px; height: 58px; padding: 10px 12px; background: #171f31; border-bottom: 1px solid #334155; }
      button { border: 1px solid #475569; border-radius: 7px; width: 34px; height: 34px; cursor: pointer; color: #dbeafe; background: #25324a; font-size: 16px; }
      button:hover { background: #334155; }
      button:disabled { cursor: default; opacity: .4; }
      #address { flex: 1; min-width: 180px; height: 34px; box-sizing: border-box; border: 1px solid #475569; border-radius: 8px; padding: 0 12px; outline: none; background: #0f172a; color: #f8fafc; font: inherit; }
      #address:focus { border-color: #60a5fa; box-shadow: 0 0 0 2px rgb(59 130 246 / .25); }
      #go { width: auto; padding: 0 13px; font-size: 13px; }
      #devtools { width: auto; padding: 0 11px; font-size: 13px; }
    </style>
  </head>
  <body>
    <nav id="toolbar" aria-label="Browser controls">
      <button id="back" title="Back (Alt+Left)" aria-label="Back">←</button>
      <button id="forward" title="Forward (Alt+Right)" aria-label="Forward">→</button>
      <button id="reload" title="Reload (Ctrl+R)" aria-label="Reload">↻</button>
      <button id="home" title="DAO3 home (Alt+Home)" aria-label="DAO3 home">⌂</button>
      <input id="address" type="text" spellcheck="false" autocomplete="off" aria-label="Address" />
      <button id="go" title="Open URL">Go</button>
      <button id="devtools" title="Developer tools (Ctrl+Shift+I)">DevTools</button>
    </nav>
    <script>
      const controls = window.browserControls;
      const address = document.querySelector('#address');
      const back = document.querySelector('#back');
      const forward = document.querySelector('#forward');
      const reload = document.querySelector('#reload');
      const home = document.querySelector('#home');
      const go = document.querySelector('#go');
      const devTools = document.querySelector('#devtools');
      const render = state => {
        if (document.activeElement !== address) address.value = state.url || '';
        back.disabled = !state.canGoBack;
        forward.disabled = !state.canGoForward;
      };
      const navigate = async () => {
        try { render(await controls.navigate(address.value)); } catch { address.select(); }
      };
      go.onclick = navigate;
      address.addEventListener('keydown', event => { if (event.key === 'Enter') navigate(); });
      back.onclick = () => controls.back();
      forward.onclick = () => controls.forward();
      reload.onclick = () => controls.reload();
      home.onclick = () => controls.home();
      devTools.onclick = () => controls.devTools();
      controls.onState(render);
      controls.state().then(render);
    </script>
  </body>
</html>
