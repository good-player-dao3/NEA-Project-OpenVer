name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: Check patch whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed whitespace
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE_SHA^{commit}"; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff-tree --no-commit-id --check -r "$HEAD_SHA"
          fi

      - name: Check forbidden tracked paths
        shell: bash
        run: |
          forbidden=$(git ls-files | grep -E '(^|/)(Evidence/dump/private|Evidence/works/private|\.workspace|NEA-Project\.7z)(/|$)' || true)
          if [ -n "$forbidden" ]; then
            printf 'Forbidden tracked paths detected:\n%s\n' "$forbidden"
            exit 1
          fi

      - name: Check changed content for secrets
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE_SHA^{commit}"; then
            diff=$(git diff --unified=0 "$BASE_SHA" "$HEAD_SHA")
          else
            diff=$(git diff-tree --no-commit-id --unified=0 -r "$HEAD_SHA")
          fi
          secret_pattern='(^\+[^+].*('
          secret_pattern+='B'earer'[[:space:]]+[A-Za-z0-9._~-]{16,}|to'ken'=[A-Za-z0-9._~%+-]{16,}|authori'zation':[[:space:]]*[^[:space:]]+))'
          if printf '%s\n' "$diff" | grep -Eiq "$secret_pattern"; then
            echo 'Potential token-bearing content found in changed lines.'
            exit 1
          fi

  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Pin LF checkout on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore MuDB toolchain
        uses: actions/cache@v4
        with:
          path: tools/.mudb-toolchain
          key: mudb-toolchain-${{ runner.os }}-node24-${{ hashFiles('Shared/mudb/package.json', 'tools/build-mudb.mjs') }}

      - name: Build MuDB transport
        run: node tools/build-mudb.mjs

      - name: Validate imported project
        run: npm --prefix Frontend/demo-map run validate

      - name: Test control bridge contract
        run: npm --prefix Frontend/demo-map run test:control-bridge

      - name: Test recovered protocol evidence
        run: node --test Middleware/runtime-compat/test/recovered-player-protocol.test.mjs

      - name: Test ABI completeness contract
        run: node --test --test-name-pattern "API ABI completeness" Middleware/runtime-compat/test/api-abi-completeness.test.mjs

      - name: Verify API ABI report regeneration
        shell: bash
        run: |
          node Middleware/runtime-compat/tools/build-api-abi-completeness.mjs
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            import { readFileSync } from "node:fs";
            const path = "Middleware/runtime-compat/generated/api-abi-completeness.json";
            const expected = JSON.parse(execFileSync("git", ["show", `HEAD:${path}`], { encoding: "utf8" }));
            const actual = JSON.parse(readFileSync(path, "utf8"));
            delete expected.generatedAt;
            delete actual.generatedAt;
            if (JSON.stringify(expected) !== JSON.stringify(actual)) {
              console.error("Generated API ABI report differs from generator output.");
              process.exit(1);
            }
          '
